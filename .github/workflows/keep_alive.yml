name: Keep FinAgent Streamlit Alive

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -s -L --max-redirs 5 -o /dev/null -w "%{http_code}\n" https://finagentai.streamlit.app/ || true
